name: Bootstrap repository
on:
  push:
    paths:
      - thief-bootstrap.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack prepared submission
        run: |
          unzip -o thief-bootstrap.zip
          rm thief-bootstrap.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import prepared thief agent" || exit 0
          git push
